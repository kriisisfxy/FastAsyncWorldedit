<title>Csillagvadasz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one full-height stage, canvas scaled to fit, overlay for start/game over. */
:root {
  --bg: #070a1c;
  --panel: #101636;
  --fg: #e8ecff;
  --muted: #8d97c7;
  --ship: #5ad1ff;
  --shot: #ffe27a;
  --enemy: #ff5d6c;
  --font: ui-rounded, "Trebuchet MS", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  justify-content: center;
  overflow: hidden;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
#stage { position: relative; height: 100%; aspect-ratio: 2 / 3; max-width: 100%; }
canvas { width: 100%; height: 100%; display: block; background: var(--bg); }
#overlay {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; text-align: center;
  background: rgba(7, 10, 28, 0.78);
}
#overlay[hidden] { display: none; }
h1 { margin: 0; font-size: 2.2rem; letter-spacing: 0.04em; text-wrap: balance; }
p { margin: 0; color: var(--muted); line-height: 1.5; max-width: 26ch; }
button {
  font: inherit; font-weight: 700; font-size: 1.1rem;
  background: var(--ship); color: #04202c;
  border: 0; border-radius: 999px; padding: 14px 36px; cursor: pointer;
}
button:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
#best { font-variant-numeric: tabular-nums; }
</style>

<div id="stage">
  <canvas id="c" width="480" height="720"></canvas>
  <div id="overlay">
    <h1 id="title">Csillagvadász</h1>
    <p id="msg">Húzd az ujjadat a hajó mozgatásához. A hajó magától lő.</p>
    <p id="best"></p>
    <button id="go" type="button">Indítás</button>
  </div>
</div>

<script>
(function () {
  var W = 480, H = 720;
  var cv = document.getElementById("c"), ctx = cv.getContext("2d");
  var overlay = document.getElementById("overlay"), titleEl = document.getElementById("title");
  var msgEl = document.getElementById("msg"), bestEl = document.getElementById("best");
  var best = 0;
  try { best = +localStorage.getItem("csv_best") || 0; } catch (e) {}

  var st, running = false, keys = {}, touch = null;

  function reset() {
    st = { p: { x: W / 2, y: H - 90, w: 36, h: 40 }, shots: [], foes: [], parts: [],
           stars: [], score: 0, lives: 3, cd: 0, spawn: 0, inv: 0 };
    for (var i = 0; i < 60; i++) st.stars.push({ x: Math.random() * W, y: Math.random() * H, v: 1 + Math.random() * 2.5 });
  }
  reset();

  function start() {
    reset(); running = true; overlay.hidden = true;
  }
  function end() {
    running = false;
    var newBest = st.score > best;
    if (newBest) { best = st.score; try { localStorage.setItem("csv_best", best); } catch (e) {} }
    titleEl.textContent = "Vége a játéknak";
    msgEl.textContent = "Pontszám: " + st.score + (newBest ? " (új rekord!)" : "");
    bestEl.textContent = "Rekord: " + best;
    document.getElementById("go").textContent = "Újra";
    overlay.hidden = false;
  }
  document.getElementById("go").addEventListener("click", start);
  bestEl.textContent = best ? "Rekord: " + best : "";

  // controls: keyboard and touch/mouse drag (relative, so the finger does not cover the ship)
  addEventListener("keydown", function (e) { keys[e.key.toLowerCase()] = true; if (e.key === " ") e.preventDefault(); });
  addEventListener("keyup", function (e) { keys[e.key.toLowerCase()] = false; });
  function pt(e) { var r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
  cv.addEventListener("pointerdown", function (e) { var q = pt(e); touch = { x: q.x, y: q.y }; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener("pointermove", function (e) {
    if (!touch || !running) return;
    var q = pt(e);
    st.p.x += q.x - touch.x; st.p.y += q.y - touch.y;
    touch.x = q.x; touch.y = q.y;
  });
  function up() { touch = null; }
  cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);

  function boom(x, y, col) {
    for (var i = 0; i < 10; i++) st.parts.push({ x: x, y: y, vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6, t: 24, c: col });
  }
  function hit(a, b) { return Math.abs(a.x - b.x) < (a.w + b.w) / 2 && Math.abs(a.y - b.y) < (a.h + b.h) / 2; }

  function update() {
    var p = st.p, s = 6;
    if (keys.arrowleft || keys.a) p.x -= s;
    if (keys.arrowright || keys.d) p.x += s;
    if (keys.arrowup || keys.w) p.y -= s;
    if (keys.arrowdown || keys.s) p.y += s;
    p.x = Math.max(p.w / 2, Math.min(W - p.w / 2, p.x));
    p.y = Math.max(p.h / 2, Math.min(H - p.h / 2, p.y));

    if (--st.cd <= 0) { st.shots.push({ x: p.x, y: p.y - 24, w: 4, h: 14 }); st.cd = 10; }
    if (--st.spawn <= 0) {
      st.foes.push({ x: 20 + Math.random() * (W - 40), y: -20, w: 34, h: 34, v: 2 + Math.random() * (1.5 + st.score / 400) });
      st.spawn = Math.max(15, 50 - st.score / 40);
    }
    st.shots.forEach(function (b) { b.y -= 12; });
    st.shots = st.shots.filter(function (b) { return b.y > -20; });
    st.foes.forEach(function (f) { f.y += f.v; });

    st.foes = st.foes.filter(function (f) {
      for (var i = 0; i < st.shots.length; i++) {
        if (hit(f, st.shots[i])) { st.shots.splice(i, 1); st.score += 10; boom(f.x, f.y, "#ff9a5d"); return false; }
      }
      if (f.y > H + 20) return false;
      if (st.inv <= 0 && hit(f, p)) {
        st.lives--; st.inv = 90; boom(p.x, p.y, "#5ad1ff");
        if (navigator.vibrate) try { navigator.vibrate(60); } catch (e) {}
        return false;
      }
      return true;
    });
    if (st.inv > 0) st.inv--;
    st.parts.forEach(function (q) { q.x += q.vx; q.y += q.vy; q.t--; });
    st.parts = st.parts.filter(function (q) { return q.t > 0; });
    st.stars.forEach(function (q) { q.y += q.v; if (q.y > H) { q.y = 0; q.x = Math.random() * W; } });
    if (st.lives <= 0) end();
  }

  function draw() {
    ctx.fillStyle = "#070a1c"; ctx.fillRect(0, 0, W, H);
    st.stars.forEach(function (q) { var c = Math.round(70 + q.v * 55); ctx.fillStyle = "rgb(" + c + "," + c + "," + (c + 20) + ")"; ctx.fillRect(q.x, q.y, q.v, q.v); });
    ctx.fillStyle = "#ffe27a";
    st.shots.forEach(function (b) { ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h); });
    ctx.fillStyle = "#ff5d6c";
    st.foes.forEach(function (f) {
      ctx.beginPath(); ctx.moveTo(f.x - f.w / 2, f.y - f.h / 2); ctx.lineTo(f.x + f.w / 2, f.y - f.h / 2); ctx.lineTo(f.x, f.y + f.h / 2); ctx.closePath(); ctx.fill();
    });
    st.parts.forEach(function (q) { ctx.globalAlpha = q.t / 24; ctx.fillStyle = q.c; ctx.fillRect(q.x, q.y, 4, 4); });
    ctx.globalAlpha = 1;
    var p = st.p;
    if (Math.floor(st.inv / 6) % 2 === 0) {
      ctx.fillStyle = "#5ad1ff";
      ctx.beginPath(); ctx.moveTo(p.x, p.y - p.h / 2); ctx.lineTo(p.x + p.w / 2, p.y + p.h / 2); ctx.lineTo(p.x, p.y + p.h / 3); ctx.lineTo(p.x - p.w / 2, p.y + p.h / 2); ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = "#e8ecff"; ctx.font = "bold 22px ui-rounded, system-ui, sans-serif";
    ctx.textAlign = "left"; ctx.fillText("Pont: " + st.score, 14, 30);
    ctx.textAlign = "right"; ctx.fillText("Élet: " + st.lives, W - 14, 30);
  }

  var last = 0, acc = 0;
  function frame(t) {
    acc += Math.min(100, t - last); last = t;
    while (acc >= 1000 / 60) { if (running) update(); else st.stars.forEach(function (q) { q.y = (q.y + q.v) % H; }); acc -= 1000 / 60; }
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(function (t) { last = t; frame(t); });
})();
</script>
